x-nocodb-env: &nocodb-env
  NC_ADMIN_EMAIL: "${NC_ADMIN_EMAIL:-admin@example.com}"
  NC_ADMIN_PASSWORD: "${NC_ADMIN_PASSWORD:-Password123!}"
  NC_AUTH_JWT_SECRET: "${NC_AUTH_JWT_SECRET:-arcanist-benchmark-jwt-secret}"
  NC_DB: "${NC_DB:-pg://postgres:5432?u=postgres&p=password&d=root_db}"
  NC_DISABLE_TELE: "${NC_DISABLE_TELE:-true}"
  NC_DASHBOARD_URL: "${NC_DASHBOARD_URL:-http://127.0.0.1:3000/dashboard}"
  NC_REDIS_URL: "${NC_REDIS_URL:-redis://redis:6379}"
  NODE_ENV: "${NODE_ENV:-development}"
  NUXT_PUBLIC_NC_BACKEND_URL: "${NUXT_PUBLIC_NC_BACKEND_URL:-http://127.0.0.1:8080}"
  PORT: "${PORT:-8080}"

services:
  web:
    build:
      context: .
      dockerfile: docker/arcanist.Dockerfile
    image: nocodb-arcanist:development
    tty: true
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      <<: *nocodb-env
    volumes:
      - ./:/app:delegated
      - ./.arcanist.npmrc:/app/.npmrc:ro
      - root_node_modules:/app/node_modules
      - nc_gui_node_modules:/app/packages/nc-gui/node_modules
      - nc_lib_gui_node_modules:/app/packages/nc-lib-gui/node_modules
      - nc_secret_mgr_node_modules:/app/packages/nc-secret-mgr/node_modules
      - nocodb_node_modules:/app/packages/nocodb/node_modules
      - nocodb_sdk_node_modules:/app/packages/nocodb-sdk/node_modules
      - nocodb_sdk_v2_node_modules:/app/packages/nocodb-sdk-v2/node_modules
      - noco_integrations_node_modules:/app/packages/noco-integrations/node_modules
      - noco_integrations_core_node_modules:/app/packages/noco-integrations/core/node_modules
      - rspack_cache:/app/packages/nocodb/node_modules/.cache
    command:
      - sh
      - -lc
      - pnpm bootstrap && git config --global --add safe.directory /app && git restore -- packages/nocodb-sdk/src/lib/Api.ts packages/nocodb/src/integrations/index.ts && ln -sfn /opt/arcanist-runtime/node_modules/exceljs /app/node_modules/exceljs && pnpm --filter=nocodb run watch:run

  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-root_db}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 2s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

volumes:
  root_node_modules:
  nc_gui_node_modules:
  nc_lib_gui_node_modules:
  nc_secret_mgr_node_modules:
  nocodb_node_modules:
  nocodb_sdk_node_modules:
  nocodb_sdk_v2_node_modules:
  noco_integrations_node_modules:
  noco_integrations_core_node_modules:
  rspack_cache:
  postgres:
  redis:
